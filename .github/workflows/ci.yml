name: FITNOVA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Validate Android API origin
        if: ${{ vars.VITE_API_URL != '' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https://[^/]+$ ]]; then
            echo "VITE_API_URL must be a public HTTPS origin without a path or trailing slash." >&2
            exit 1
          fi
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Configure Firebase client
        if: ${{ vars.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ vars.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: npx cap sync android
      - run: bash android/gradlew --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        if: ${{ vars.VITE_API_URL != '' && vars.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
        with:
          name: fitnova-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
