name: FITNOVA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm install --no-audit --no-fund
      - name: Validate Android API origin
        if: ${{ vars.VITE_API_URL != '' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https://[^/]+$ ]]; then
            echo "VITE_API_URL must be a public HTTPS origin without a path or trailing slash." >&2
            exit 1
          fi
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Configure Firebase client
        if: ${{ vars.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ vars.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: npx cap sync android
      - name: Check Android release signing configuration
        id: release-signing-check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not all configured; skipping signed AAB."
          fi
      - name: Configure Android release signing
        if: ${{ steps.release-signing-check.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitnova-release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fitnova-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: bash android/gradlew --no-daemon -p android assembleDebug
      - name: Build signed Google Play release bundle
        if: ${{ steps.release-signing-check.outputs.enabled == 'true' }}
        run: bash android/gradlew --no-daemon -p android bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ vars.VITE_API_URL != '' && vars.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
        with:
          name: fitnova-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ steps.release-signing-check.outputs.enabled == 'true' }}
        with:
          name: fitnova-android-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab

  production-smoke:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check production API and persistent database configuration
        run: |
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 10 --max-time 30 https://fitnova-api-yt9t.onrender.com/health)"
          printf '%s\n' "$response"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert d.get("database") == "configured", "Production API is not configured for persistent PostgreSQL"; print("Production API health and PostgreSQL configuration confirmed.")' <<< "$response"
      - name: Check public policy routes
        run: |
          for path in privacy terms community-guidelines; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "https://fitnova-songtu183638.vercel.app/$path")"
            echo "/$path -> HTTP $code"
            test "$code" = "200"
          done
